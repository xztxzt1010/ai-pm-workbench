[package]
name = "app"
version = "0.2.0"
description = "Local-first AI product manager workspace"
authors = ["xztxzt1010"]
license = "MIT"
repository = "https://github.com/xztxzt1010/ai-pm-workbench"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
keyring = { version = "4.1.4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
tauri-plugin-dialog = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
notify-rust = "4.18.0"
sha2 = "0.10.9"
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-shell = "2.3.5"
getrandom = "0.3.4"
url = "2.5.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

